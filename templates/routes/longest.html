{% extends 'routes/base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 shadow-sm border-0 text-center">
            <h3 class="fw-bold mb-3">Airport with Longest Duration</h3>
            {% if airport %}
                <p class="fs-4 mb-1"><strong>{{ airport.code }}</strong></p>
                <p class="text-muted">Duration: {{ airport.duration }} minutes</p>
            {% else %}
                <p class="text-muted">No airports available.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
